<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home | StyleSnap</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="home-page">
  <nav class="navbar">
    <div class="brand">StyleSnap</div>
    <ul class="nav-links center-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="contact.html">Contact</a></li>
     <!-- <li><a id="loginLink" href="login.html">Login</a></li>/-->
    </ul>

    <div class="right-section">
      <a href="cart.html" class="cart-link">
        🛒 <span id="cartCount" style="background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px;">0</span>
      </a>
      <div class="profile-container">
        <span id="profileIcon" class="profile-icon">👤</span>
        <div id="profileDropdown" class="dropdown hidden"></div>
      </div>
    </div>
  </nav>

  <header class="home-header">
    <h1 class="main-header">Welcome to StyleSnap!</h1>
    <p>Find the best fashion on your terms.</p>
    <a href="#products-section" class="btn">Shop Now</a>
  </header>

  <section id="products-section" class="products-section-grid">
    <div class="grid-item image">
      <img src="http://localhost:8083/images/her.jpg" alt="Clothes for Her" />
    </div>
    <div class="grid-item text">
      <h2>Clothes for Her</h2>
      <p>Shop for classic or trendy pieces you can wear every day.</p>
      <a href="products.html?category=female" class="btn">SHOP HERE</a>
    </div>
    <div class="grid-item text">
      <h2>Clothes for Him</h2>
      <p>Step out in style with our must-have casual outfits.</p>
      <a href="products.html?category=male" class="btn">SHOP HERE</a>
    </div>
    <div class="grid-item image">
      <img src="http://localhost:8083/images/him.jpg" alt="Clothes for Him" />
    </div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/cart-count.js"></script> 
  <script src="js/user-status.js"></script>
</body>
</html>
