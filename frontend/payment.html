<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>StyleSnap - Payment</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <nav class="navbar">
    <div class="brand">StyleSnap</div>
    <ul class="nav-links center-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="contact.html">Contact</a></li>
      <!--<li><a id="loginLink" href="login.html">Login</a></li>-->
    </ul>

    <div class="right-section">
      <a href="cart.html" class="cart-link">
        🛒 <span id="cartCount" style="background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px;">0</span>
      </a>
      <div class="profile-container">
        <span id="profileIcon" class="profile-icon">👤</span>
        <div id="profileDropdown" class="dropdown hidden"></div>
      </div>
    </div>
  </nav>
    
  <div class="checkout-steps">
    Bag ➡️ 🏡 Address ➡️ 💳 Payment
  </div>
  <div class="payment-container">
    <div class="payment-section">
      <h2>🧾 Payment Options</h2>
      <label><input type="radio" name="paymentMethod" checked /> PhonePe UPI</label><br>
      <label><input type="radio" name="paymentMethod" /> Credit/Debit Card</label><br>
      <label><input type="radio" name="paymentMethod" /> Cash on Delivery (Cash/UPI)</label>
    </div>
    <div class="price-details">
      <h2>📦 Price Details</h2>
      <p>Total MRP: <span id="totalCost"></span></p>
      <p>Discount: <span id="discount"></span></p>
      <p>Platform Fee: <span id="platformFee"></span></p>
      <p class="total">Total Amount: <span id="finalPrice"></span></p>
      <button id="payNowBtn">Pay Now</button>
    </div>
  </div>
  <script src="js/payment.js"></script>
  <script src="js/config.js"></script>
  <script src="js/cart-count.js"></script>
  <script src="js/user-status.js"></script>

  
  <script>
    updateCartCount();
  </script>
  </body>
  
</body>
</html>
