<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Signup Page</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="signup-page">
  <nav class="navbar">
    <div class="brand">StyleSnap</div>
    <ul class="nav-links center-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="products.html">Products</a></li>
      <li><a href="contact.html">Contact</a></li>
      <!--<li><a id="loginLink" href="login.html">Login</a></li>-->
    </ul>

    <div class="right-section">
      <a href="cart.html" class="cart-link">
        🛒 <span id="cartCount" style="background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px;">0</span>
      </a>
      <div class="profile-container">
        <span id="profileIcon" class="profile-icon">👤</span>
        <div id="profileDropdown" class="dropdown hidden"></div>
      
      
      </div>
    </div>
  </nav>

  <div class="container">
    <div class="offer-banner">
      <p><strong>Sign Up & Get 15% OFF + Free Shipping</strong><br>On Your First Order</p>
    </div>

    <div class="form-box">
      <h2>Create Your Account</h2>
      <form id="signupForm" method="post">
        <p id="signupMessage" class="welcome-msg"></p>

        <label for="signupName">Full Name</label>
        <input type="text" id="signupName" name="name" required />

        <label for="signupEmail">Email</label>
        <input type="email" id="signupEmail" name="email" required />

        <label for="signupPassword">Password</label>
        <input type="password" id="signupPassword" name="password" required />

        <button type="submit">CREATE ACCOUNT</button>
      </form>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/user-status.js"></script>
  <script src="js/cart-count.js"></script>
  <script src="js/signup.js"></script>
</body>
</html>
